<script>
const view = document.getElementById('view');
const meta = document.getElementById('meta');
let active = 'connections';
let timer = null;

function isExternal(ip) {
  if (!ip) return false;
  return !/^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|127\.|::1|fe80|0\.0\.0\.0|::$)/.test(ip);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// Per-run token injected by the server when it served this page. It goes in a
// custom header, which is what actually blocks cross-site requests: a custom
// header forces a CORS preflight that an attacking page cannot satisfy.
const ARK_HEADERS = { 'X-ARK-Token': (window.__ARK_TOKEN__ || '') };

// Fetch with a timeout and one retry. A transient hiccup (PowerShell busy, server
// mid-restart) should not leave the pane empty and silent.
async function api(p, opts){
  const tries = (opts && opts.tries) || 2;
  const timeout = (opts && opts.timeout) || 60000;
  let last = 'unknown error';
  for (let i = 0; i < tries; i++){
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), timeout);
    try {
      const r = await fetch(p, { signal: ctl.signal, headers: ARK_HEADERS });
      clearTimeout(t);
      if (!r.ok) { last = 'HTTP ' + r.status + ' from ' + p; }
      else return await r.json();
    } catch(e){
      clearTimeout(t);
      last = e.name === 'AbortError' ? ('Timed out after ' + Math.round(timeout/1000) + 's') : e.message;
    }
    if (i < tries - 1) await new Promise(r => setTimeout(r, 800));
  }
  return { ok:false, error:last, data:[] };
}

// Render a readable failure in the pane instead of leaving it blank.
function showError(where, err, retryFn, target){
  (target || view).innerHTML = `<div class="muted" style="border-left:3px solid #e06c75;padding:10px 14px">
    <div style="color:#e06c75;font-weight:600;margin-bottom:6px">Couldn't load ${esc(where)}</div>
    <div>${esc(err || 'Unknown error')}</div>
    <div style="margin-top:10px">
      <button id="errRetry" class="btn">Retry</button>
      <span style="margin-left:10px">If this persists, check the server window, or open
      <a href="/api/health" target="_blank">/api/health</a>.</span>
    </div></div>`;
  const b = document.getElementById('errRetry');
  if (b && retryFn) b.onclick = retryFn;
  setMeta('error');
}
async function api2(p, method){
  try { const r = await fetch(p, { method, headers: ARK_HEADERS }); return await r.json(); }
  catch(e){ return { ok:false, error:e.message, data:[] }; }
}
async function api2json(p, method, body){
  try { const r = await fetch(p, { method, headers: Object.assign({ 'Content-Type':'application/json' }, ARK_HEADERS), body: JSON.stringify(body) }); return await r.json(); }
  catch(e){ return { ok:false, error:e.message, data:[] }; }
}

function setMeta(t){ meta.textContent = t + ' · ' + new Date().toLocaleTimeString(); }

async function checkAdmin(){
  const pill = document.getElementById('adminPill');
  const r = await api('/api/admin');
  if (r.admin){ pill.className = 'pill adm'; pill.textContent = 'Administrator'; }
  else { pill.className = 'pill noadm'; pill.textContent = 'Standard user — limited'; pill.title = 'Run via RUN-ADMIN.bat for firewall logs, full registry, and process kill.'; }
}

// ---------- CONNECTIONS ----------
const ORDER = { UNKNOWN: 0, ELEVATED: 1, MODERATE: 2, LOW: 3, SAFE: 4, LOCAL: 5 };
const LEVEL_COLOR = { SAFE:'#3ddc84', LOW:'#9ad94f', MODERATE:'#ffc107', ELEVATED:'#ff8c3a', UNKNOWN:'#ff5252', LOCAL:'#5a6b7a' };
function threatBadge(t){
  const lv = (t && t.level) || 'LOCAL';
  const c = (t && t.color) || LEVEL_COLOR[lv] || '#5a6b7a';
  const title = t && t.reasons ? t.reasons.join('  •  ') : '';
  return `<span class="badge" title="${esc(title)}" style="background:${c}22;color:${c};border:1px solid ${c}66">${lv}</span>`;
}
async function renderConnections(){
  const res = await api('/api/connections');
  if (res.ok === false){ showError('active connections', res.error, renderConnections); return; }
  let rows = res.data || [];
  // sort most-severe first (external risk on top), keep LOCAL at bottom
  rows = rows.slice().sort((a,b) => (ORDER[a.threat?.level] ?? 9) - (ORDER[b.threat?.level] ?? 9));
  const ext = rows.filter(r => r.threat && r.threat.level !== 'LOCAL');
  const count = lv => ext.filter(r => r.threat.level === lv).length;
  const risky = count('UNKNOWN') + count('ELEVATED');
  // Preserve scroll position across the auto-refresh re-render (don't jump to top)
  const prevScrollEl = view.querySelector('.scroll');
  const prevScrollTop = prevScrollEl ? prevScrollEl.scrollTop : 0;
  const prevWinY = window.scrollY;
  view.innerHTML = `
    ${res.ok ? '' : `<div class="alert a-bad">Error: ${esc(res.error)}</div>`}
    ${risky ? `<div class="alert a-bad">${risky} external connection(s) rated ELEVATED or UNKNOWN — review the top rows. Hover a badge for the reasoning.</div>`
            : (ext.length ? `<div class="alert a-info">${ext.length} external connection(s); none rated elevated. Hover a badge to see why.</div>` : '')}
    <div class="stats">
      <div class="stat"><div class="l">Established</div><div class="v">${rows.length}</div></div>
      <div class="stat"><div class="l">Safe / Low</div><div class="v" style="color:#3ddc84">${count('SAFE')+count('LOW')}</div></div>
      <div class="stat"><div class="l">Moderate</div><div class="v" style="color:#ffc107">${count('MODERATE')}</div></div>
      <div class="stat"><div class="l">Elevated</div><div class="v" style="color:#ff8c3a">${count('ELEVATED')}</div></div>

function sigClass(s){
  if (/^Valid$/i.test(s)) return 'sig-ok';

async function investigate(pid){

async function killPid(pid, name){
  if (!confirm('Kill process ' + name + ' (PID ' + pid + ')?\\n\\nThis force-terminates it immediately. Killing a critical system process can crash Windows.')) return;
  const res = await api2('/api/kill?pid=' + pid, 'POST');
  const d = (res.data && res.data[0]) || res;
  if (d.Killed){
    closeModal();
    setMeta('killed PID ' + pid + (d.Via ? ' (' + d.Via + ')' : ''));
    RENDER[active]();
  } else if (d.Denied || /denied/i.test(d.Error || '')){
    if (d.Admin){
      alert('Access denied killing PID ' + pid + ' (' + (d.Name||name) + ').\\n\\n'
        + 'ARK IS running as Administrator, so this is a PROTECTED process — Windows blocks even admins from terminating it (e.g. a protected/PPL system or antivirus process). This is by design and cannot be overridden from user space.');
    } else {
      alert('Access denied — ARK is running as a STANDARD user.\\n\\n'
        + 'To kill processes owned by the system or other accounts, relaunch ARK elevated:\\n'
        + '  • Close the current ARK server window, then\\n'
        + '  • Double-click  C:\\\\ARK\\\\RUN-ADMIN.bat  and approve the UAC prompt.\\n\\n'
        + 'The header pill will then read "Administrator".');
    }
  } else {
    alert('Could not kill PID ' + pid + ':\\n' + (d.Error || res.error || 'unknown error'));
  }
}

// ---------- FIREWALL (posture + scored inbound-allow rules) ----------
const FW_ORDER = { HIGH:0, ELEVATED:1, MODERATE:2, LOW:3, SAFE:4, INFO:5, OFF:6 };
async function renderFirewall(){
  const res = await api('/api/firewall');
  if (res.ok === false){ showError('firewall logs', res.error, renderFirewall); return; }
  const d = (res.data && res.data[0]) || { profiles:[], rules:[] };
  const profiles = d.profiles || [];
  const rules = d.rules || [];
  // the attack surface = inbound ALLOW + active rules, scored
  let holes = rules.filter(r => r.threat && r.threat.inboundAllow);
  holes.sort((a,b) => (FW_ORDER[a.threat.level] ?? 9) - (FW_ORDER[b.threat.level] ?? 9) || (a.threat.score - b.threat.score));
  const count = lv => holes.filter(r => r.threat.level === lv).length;
  const risky = count('HIGH') + count('ELEVATED');
  const blocked = rules.filter(r => (r.Action||'').toLowerCase()==='block').length;

  const profilePill = p => {
    const bad = !p.Enabled || /allow/i.test(p.Inbound);
    const c = !p.Enabled ? '#ff5252' : (/allow/i.test(p.Inbound) ? '#ff8c3a' : '#3ddc84');
    return `<div class="stat" style="border-left:3px solid ${c}">
      <div class="l">${esc(p.Name)} profile</div>
      <div class="v" style="font-size:1rem;color:${c}">${p.Enabled?'ON':'OFF'}</div>
      <div class="muted" style="padding:0;font-size:.74rem">in: ${esc(p.Inbound)} · out: ${esc(p.Outbound)}</div>
    </div>`;
  };

  view.innerHTML = `
    ${res.ok ? '' : `<div class="alert a-bad">Error: ${esc(res.error)}</div>`}
    ${profiles.some(p=>!p.Enabled) ? `<div class="alert a-bad">A firewall profile is DISABLED — your machine is exposed on that network type.</div>` : ''}
    ${risky ? `<div class="alert a-warn">${risky} inbound-allow rule(s) rated ELEVATED/HIGH — these are open holes in your firewall. Hover a badge for why.</div>`
            : `<div class="alert a-info">No high-risk inbound allow rules. Hover a badge to see each rule's reasoning.</div>`}
    <div class="stats">${profiles.map(profilePill).join('')}</div>
    <div class="stats">
      <div class="stat"><div class="l">Inbound-allow rules</div><div class="v">${holes.length}</div></div>
      <div class="stat"><div class="l">Safe / Low</div><div class="v" style="color:#3ddc84">${count('SAFE')+count('LOW')}</div></div>
      <div class="stat"><div class="l">Moderate</div><div class="v" style="color:#ffc107">${count('MODERATE')}</div></div>
      <div class="stat"><div class="l">Elevated</div><div class="v" style="color:#ff8c3a">${count('ELEVATED')}</div></div>
      <div class="stat"><div class="l">High</div><div class="v" style="color:#ff5252">${count('HIGH')}</div></div>
      <div class="stat"><div class="l">Block rules</div><div class="v" style="color:#9fb3c8">${blocked}</div></div>
    </div>
    <div style="display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:1rem;font-size:.78rem;color:#9fb3c8">
      <span><span style="color:#3ddc84">●</span> SAFE</span><span><span style="color:#9ad94f">●</span> LOW</span>
      <span><span style="color:#ffc107">●</span> MODERATE</span><span><span style="color:#ff8c3a">●</span> ELEVATED</span>
      <span><span style="color:#ff5252">●</span> HIGH — broad/any program, sensitive port, or public network</span>
      <span style="margin-left:auto">Showing inbound ALLOW rules (your attack surface). ${blocked} block rules hidden.</span>
    </div>
    <div class="scroll"><table><thead><tr>
      <th>Threat</th><th>Trust</th><th>Rule</th><th>Program</th><th>Port</th><th>Proto</th><th>Profile</th>
    </tr></thead><tbody>
      ${holes.length ? holes.map(r => {
        const t = r.threat, c = t.color;
        return `<tr style="box-shadow:inset 3px 0 0 ${c}">
          <td><span class="badge" title="${esc(t.reasons.join('  •  '))}" style="background:${c}22;color:${c};border:1px solid ${c}66">${t.level}</span></td>
          <td class="mono" style="color:${c};font-weight:600">${t.score==null?'—':t.score}</td>
          <td style="font-size:.82rem">${esc(r.Name||'(unnamed)')}</td>
          <td class="mono" style="font-size:.76rem">${r.App?esc(r.App):'<span class="ext">ANY program</span>'}</td>
          <td class="mono">${r.LPort?esc(r.LPort):'<span class="sig-unk">Any</span>'}</td>
          <td class="mono" style="font-size:.8rem">${esc(r.Proto||'')}</td>
          <td style="font-size:.78rem;color:#9fb3c8">${esc(r.Profile||'All')}</td>
        </tr>`;
      }).join('') : `<tr><td colspan="7" class="muted">No active inbound allow rules found</td></tr>`}
    </tbody></table></div>`;
  setMeta(holes.length + ' inbound-allow rules · ' + risky + ' risky');
}

async function deleteSelectedStartup(boxes){
  const chosen = boxes.filter(b => b.checked).map(b => startupRows[parseInt(b.dataset.i,10)]).filter(Boolean);
  if (!chosen.length){ alert('Nothing selected. Tick the checkbox next to the startup items you want to remove.'); return; }
  const list = chosen.map(r => '  • [' + r.Source + '] ' + r.Name).join('\\n');
  if (!confirm('Remove these ' + chosen.length + ' startup item(s)?\\n\\n' + list
    + '\\n\\nThey will be BACKED UP to C:\\\\ARK\\\\quarantine (registry values logged, startup files moved) so you can restore them. Registry HKLM changes require ARK to be running as Administrator.')) return;
  const payload = { items: chosen.map(r => ({ source: r.Source, name: r.Name, value: r.Value })) };
  const res = await api2json('/api/startup/delete', 'POST', payload);
  const out = res.data && res.data[0] ? res.data[0] : res;
  const results = (out && out.results) || [];
  const okN = results.filter(x => x.ok).length;
  const failN = results.length - okN;
  const detail = results.map(x => (x.ok ? '✓ ' : '✗ ') + x.name + ' — ' + x.msg).join('\\n');
  alert('Done: ' + okN + ' removed, ' + failN + ' skipped/failed.\\n'
    + (out.backup ? 'Backup log: ' + out.backup + '\\n\\n' : '\\n') + detail);
  renderStartup();
}

  const results = (out && out.results) || [];
  const okN = results.filter(x=>x.ok).length;
  alert('Done: ' + okN + ' disabled, ' + (results.length-okN) + ' skipped/refused.\\n'
    + (out.backup?'Backup: '+out.backup+'\\n\\n':'\\n') + results.map(x=>(x.ok?'✓ ':'✗ ')+x.name+' — '+x.msg).join('\\n'));
  renderServices();
}

let programRows = [];
function progLocked(r){ return /microsoft|windows defender/i.test(r.Publisher||''); }
async function renderPrograms(){
  const body = document.getElementById('regBody');
  const res = await api('/api/programs');
  if (res.ok === false){ showError('installed programs', res.error, renderPrograms, body); return; }
  const rows = res.data || [];
  programRows = rows;
  const noPub = rows.filter(r => !r.Publisher || !r.Publisher.trim());
  body.innerHTML = `
    ${noPub.length ? `<div class="alert a-warn">${noPub.length} program(s) have NO publisher (highlighted) — legitimate software almost always lists one.</div>`
                   : `<div class="alert a-info">All installed programs list a publisher.</div>`}
    <div class="stats">
      <div class="stat"><div class="l">Installed programs</div><div class="v">${rows.length}</div></div>
      <div class="stat"><div class="l">No publisher</div><div class="v" style="color:${noPub.length?'#ffc107':'#4caf50'}">${noPub.length}</div></div>
    </div>
    <div class="row" style="margin-bottom:.6rem">
      <button class="mini danger" id="uninBtn" style="font-size:.85rem;padding:.45rem .9rem">Uninstall selected</button>
      <span class="muted" id="progSelCount" style="padding:0;font-size:.82rem">0 selected</span>
      <span class="muted" style="padding:0;font-size:.78rem;margin-left:auto">Runs the vendor's uninstaller (its window may pop up). 🔒 = Microsoft-published, protected.</span>
    </div>
    <div class="scroll"><table><thead><tr>
      <th style="width:34px"></th><th>Name</th><th>Publisher</th><th>Version</th><th>Location</th>
    </tr></thead><tbody>
      ${rows.length ? rows.map((r,i) => {
        const np = !r.Publisher || !r.Publisher.trim(); const lk = progLocked(r);
        return `<tr${np?' style="background:rgba(255,193,7,.06)"':''}>
          <td>${lk?'<span title="Microsoft-published — protected">🔒</span>':`<input type="checkbox" class="progSel" data-i="${i}"/>`}</td>
          <td>${esc(r.Name)}</td>
          <td class="${np?'sig-unk':''}">${np?'— none —':esc(r.Publisher)}</td>
          <td class="mono" style="font-size:.82rem">${esc(r.Version)||'—'}</td>
          <td class="mono" style="font-size:.78rem;color:#9fb3c8">${esc(r.Location)||'—'}</td>
        </tr>`;
      }).join('') : `<tr><td colspan="5" class="muted">No programs found</td></tr>`}
    </tbody></table></div>`;
  setMeta(rows.length + ' programs');
  const boxes = () => Array.from(body.querySelectorAll('.progSel'));
  const upd = () => body.querySelector('#progSelCount').textContent = boxes().filter(b=>b.checked).length + ' selected';
  boxes().forEach(b => b.onchange = upd);
  body.querySelector('#uninBtn').onclick = () => uninstallSelected(boxes());
}
async function uninstallSelected(boxes){
  const chosen = boxes.filter(b=>b.checked).map(b=>programRows[parseInt(b.dataset.i,10)]).filter(Boolean);
  if (!chosen.length){ alert('Nothing selected.'); return; }
  const list = chosen.map(r => '  • ' + r.Name).join('\n');
  if (!confirm('Uninstall these ' + chosen.length + ' program(s)?\n\n' + list
    + '\n\nThis launches each vendor\'s own uninstaller — a setup/uninstall window may appear and need your input. Microsoft-published items are refused automatically.')) return;
  const res = await api2json('/api/programs/uninstall','POST',{ items: chosen.map(r=>({name:r.Name})) });
  const out = res.data && res.data[0] ? res.data[0] : res;
  const results = (out && out.results) || [];
  const okN = results.filter(x=>x.ok).length;
  alert('Done: ' + okN + ' launched, ' + (results.length-okN) + ' skipped/refused.\n\n'
    + results.map(x=>(x.ok?'✓ ':'✗ ')+x.name+' — '+x.msg).join('\n')
    + '\n\nNote: a successful "launch" means the uninstaller started — follow its prompts to finish.');
  setTimeout(renderPrograms, 1500);
}

// ---------- CONNECTION GUARD ----------
let guardState = { mode: 'notify', pendingAlerts: [] };

async function renderGuards(){
  const body = document.getElementById('regBody');
  const res = await api('/api/guard');
  if (res.ok === false){ showError('Connection Guard', res.error, renderGuards, body); return; }

  const mode = res.data && res.data.mode || 'notify';
  const pending = res.data && res.data.pending || [];

  guardState.mode = mode;
  guardState.pendingAlerts = pending;

  const modes = ['off', 'notify', 'ask'];

  body.innerHTML = `
    <div class="alert a-info" style="margin-bottom:1rem">
      <strong>Connection Guard</strong> monitors for new inbound network connections from external IPs.
      Choose how to handle them:
    </div>
    <div class="stats" style="margin-bottom:1rem">
      <div class="stat"><div class="l">Current Mode</div><div class="v">${mode}</div></div>
      <div class="stat"><div class="l">Pending Alerts</div><div class="v" style="color:${pending.length?'#ffc107':'#4caf50'}">${pending.length}</div></div>
    </div>

    <div style="margin-bottom:1rem">
      <div style="margin-bottom:.5rem;font-size:.85rem;color:#888">How should ARK handle new inbound connections?</div>
      ${modes.map(m => `
        <label style="display:block;margin:.3rem 0">
          <input type="radio" name="guardMode" value="${m}" ${mode===m?'checked':''}>
          <span style="margin-left:.5rem">${m === 'off' ? 'Off — Let all connections through, only log'
            : m === 'notify' ? 'Notify — Alert in notification panel, let all through'
            : 'Ask — Prompt user to allow or block each connection'}</span>
        </label>
      `).join('')}
      <button class="mini act" id="saveGuardMode" style="margin-top:.5rem">Save Mode</button>
    </div>

    <div id="pendingAlertsSection">
      ${pending.length ? `
        <div style="margin-bottom:.5rem;font-size:.85rem;color:#888">Pending Alerts (${pending.length})</div>
        <table style="width:100%;border-collapse:collapse">
          <thead><tr>
            <th>Remote</th><th>Local</th><th>PID</th><th>Action</th>
          </tr></thead>
          <tbody>
            ${pending.map((p, i) => `
              <tr style="background:rgba(0,212,255,.05)">
                <td class="mono">${esc(p.remote)}:${p.remotePort}</td>
                <td class="mono">${esc(p.localAddress)}:${p.localPort}</td>
                <td class="mono">${p.pid}</td>
                <td>
                  <button class="mini guard-action" data-guard-action="allow_once" data-guard-conv="${p.conversationId}" style="margin-right:.3rem">Allow Once</button>
                  <button class="mini guard-action" data-guard-action="allow_forever" data-guard-conv="${p.conversationId}" style="margin-right:.3rem">Allow Forever</button>
                  <button class="mini danger guard-action" data-guard-action="block_forever" data-guard-conv="${p.conversationId}" style="margin-right:.3rem">Block Forever</button>
                  <button class="mini guard-investigate-btn" data-guard-conv="${p.conversationId}" style="margin-right:.3rem">Investigate</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      ` : `
        <div class="muted" style="padding:1rem;text-align:center">No pending alerts. All connections are being handled according to your mode settings.</div>
      `}
    </div>

    <div style="margin-top:1rem;padding-top:1rem;border-top:1px solid #2a3447;font-size:.8rem;color:#888">
      <div><strong>off</strong>: No blocking, only logged. Use for passive monitoring.</div>
      <div><strong>notify</strong>: Alerts via Windows toast, all connections allowed.</div>
      <div><strong>ask</strong>: Shows this dialog for each new connection. Choose Allow Once, Allow Forever, Block Forever, or Investigate.</div>
    </div>
  `;

  setMeta('guard: ' + pending.length + ' pending');

  // Add event listener for save button
  const saveBtn = document.getElementById('saveGuardMode');
  if (saveBtn) {
    saveBtn.onclick = async () => {
      const newMode = document.querySelector('input[name="guardMode"]:checked').value;
      const r = await api2json('/api/guard/mode', 'POST', { mode: newMode });
      if (r.ok) {
        alert('Mode saved to ' + newMode);
        renderGuards();
      } else {
        alert('Error: ' + (r.error || 'Unknown'));
      }
    };
  }
}

async function guardResolve(pending, action){
  const r = await api2json('/api/guard/resolve', 'POST', { action, conversationId: pending.conversationId });
  if (r.ok) {
    renderGuards();
  } else {
    alert('Error: ' + (r.error || 'Unknown'));
  }
}

window.guardAllowOnce = function(convId){
  guardResolve({ conversationId: convId }, 'allow_once');
};
window.guardAllowForever = function(convId){
  guardResolve({ conversationId: convId }, 'allow_forever');
};
window.guardBlockForever = function(convId){
  guardResolve({ conversationId: convId }, 'block_forever');
};
window.guardInvestigate = async function(pendingInput){
  // Get process details - we need to find the pending rule first
  const res = await api('/api/guard');
  const pending = (res.data && res.data.pending) ? res.data.pending.find(r => r.conversationId === pendingInput.conversationId) : null;
  if (!pending) return;

  const procRes = await api('/api/process?pid=' + pending.pid);
  const proc = procRes.data || {};
  const info = 'Process: ' + (proc.Name || 'Unknown') + '\\n'
             + 'Path: ' + (proc.Path || 'Unknown') + '\\n'
             + 'Publisher: ' + (proc.Company || 'Unknown') + '\\n'
             + 'Signature: ' + (proc.Signature || 'Unknown');
  alert('Investigate connection from: ' + pending.remote + ':' + pending.remotePort + '\\n\\n' + info);
  guardResolve(pending, 'investigate');
}

const RENDER = { connections: renderConnections, ports: renderPorts, firewall: renderFirewall, registry: renderRegistry, guards: renderGuards };
const AUTO = { connections: 5000, firewall: 15000, guards: 5000 }; // auto-refresh intervals

function switchTab(tab){
  active = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  if (timer) clearInterval(timer);
  view.innerHTML = '<div class="muted">Loading…</div>';
  RENDER[tab]();
  if (AUTO[tab]) timer = setInterval(RENDER[tab], AUTO[tab]);
}

document.querySelectorAll('.tab').forEach(t => t.onclick = () => switchTab(t.dataset.tab));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// Connection guard action buttons (delegated, since they're created dynamically)
document.addEventListener('click', e => {
  const btn = e.target.closest('.guard-action');
  if (btn) {
    const convId = btn.dataset.guardConv;
    const action = btn.dataset.guardAction;
    if (action === 'allow_once') guardAllowOnce({conversationId: convId});
    else if (action === 'allow_forever') guardAllowForever({conversationId: convId});
    else if (action === 'block_forever') guardBlockForever({conversationId: convId});
  }
});

// Investigate button for guards (also delegated)
document.addEventListener('click', e => {
  const btn = e.target.closest('.guard-investigate-btn');
  if (btn) {
    guardInvestigate({conversationId: btn.dataset.guardConv});
  }
});

checkAdmin();
switchTab('connections');
</script>
